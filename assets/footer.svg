<svg width="1200" height="110" viewBox="0 0 1200 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Footer wave banner for Yapidev">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="1200" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="footBorder" x1="0" y1="0" x2="1200" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="footClip">
      <rect width="1200" height="110" rx="16"/>
    </clipPath>
    <style>
      .sans { font-family: "Liberation Sans", "DejaVu Sans", Arial, Helvetica, sans-serif; }
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#footClip)">
    <rect width="1200" height="110" rx="16" fill="url(#footBg)"/>
    <path d="M0 78 C 220 42, 420 105, 640 72 C 860 39, 1020 96, 1200 66 L 1200 110 L 0 110 Z" fill="url(#wave1)"/>
    <path d="M0 90 C 260 66, 460 112, 720 82 C 940 56, 1080 98, 1200 84 L 1200 110 L 0 110 Z" fill="url(#wave2)"/>
    <text x="600" y="45" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="600" class="sans">Thanks for visiting — let's build something fast, practical &amp; impactful.</text>
    <text x="600" y="70" text-anchor="middle" fill="#94A3B8" font-size="13" class="mono">github.com/Yapidev  ·  yafihabibi22@gmail.com  ·  Probolinggo, Indonesia</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="108.5" rx="15.25" stroke="url(#footBorder)" stroke-width="1.5"/>
</svg>
